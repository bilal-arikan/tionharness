name: Release

# Tag-driven release pipeline. A push of `vX.Y.Z` builds the cross-compiled
# artifacts with scripts/build-release.sh and publishes them to the static
# download host (deploy/release-host) over SSH.
#
# The publish target is fully parametric: while no VPS exists the RELEASE_HOST
# secret is empty and the publish step skips loudly instead of failing the run
# or pretending it shipped.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (with or without the leading v)'
        required: false
        default: ''

# One release at a time; never let two runs race over latest.json.
concurrency:
  group: release-tionharness
  cancel-in-progress: false

jobs:
  # Same gate as ci.yml. A workflow cannot `needs:` a job in another workflow
  # file, so the check is repeated here rather than trusted to run elsewhere —
  # a release must never ship a red build.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIONHARNESS_ENABLE_SHELL: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Placeholder for the embedded SPA
        run: mkdir -p internal/web/dist && touch internal/web/dist/index.html

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race -timeout 900s

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Tags are needed by build-release.sh (git describe) and by the version
      # resolution below, so fetch the full history rather than a shallow tip.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Tag push -> ref_name is the tag; manual run -> the dispatch input.
      - name: Resolve version
        env:
          REF_NAME: ${{ gitea.ref_name }}
          INPUT_VERSION: ${{ gitea.event.inputs.version }}
        run: |
          RAW="${INPUT_VERSION:-$REF_NAME}"
          VERSION="${RAW#v}"
          if [ -z "$VERSION" ]; then
            echo "No version: push a vX.Y.Z tag or supply the version input." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Releasing version $VERSION"

      - name: Build release artifacts
        env:
          NODE_OPTIONS: --max_old_space_size=1536
          FEED_BASE: ${{ secrets.FEED_BASE }}
        run: |
          export FEED_BASE="${FEED_BASE:-https://dl.tionharness.com}"
          echo "Feed base: $FEED_BASE"
          scripts/build-release.sh "$VERSION"
          ls -la "dist/release/$VERSION"

      - name: Prepare SSH
        env:
          RELEASE_HOST: ${{ secrets.RELEASE_HOST }}
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          if [ -z "$RELEASE_HOST" ]; then
            echo "RELEASE_HOST is empty - skipping SSH setup (no publish target configured)."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$RELEASE_SSH_KEY" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key

      - name: Ensure rsync
        env:
          RELEASE_HOST: ${{ secrets.RELEASE_HOST }}
        run: |
          if [ -z "$RELEASE_HOST" ]; then
            echo "RELEASE_HOST is empty - skipping rsync install."
            exit 0
          fi
          command -v rsync >/dev/null || { apt-get update && apt-get install -y rsync; }

      # Mirrors deploy/release-host/sync-release.sh: artifacts land in
      # <RELEASE_PATH>/v<version>/ first, and latest.json is promoted LAST so the
      # feed never advertises a version whose files are not downloadable yet.
      - name: Publish to download host
        env:
          RELEASE_HOST: ${{ secrets.RELEASE_HOST }}
          RELEASE_USER: ${{ secrets.RELEASE_USER }}
          RELEASE_PATH: ${{ secrets.RELEASE_PATH }}
        run: |
          if [ -z "$RELEASE_HOST" ]; then
            echo "RELEASE_HOST is empty - publish SKIPPED."
            echo "Artifacts were built at dist/release/$VERSION but nothing was uploaded."
            echo "Set the RELEASE_HOST / RELEASE_USER / RELEASE_PATH / RELEASE_SSH_KEY secrets to enable publishing."
            exit 0
          fi
          RELEASE_USER="${RELEASE_USER:-hermes}"
          RELEASE_PATH="${RELEASE_PATH:-/srv/dl}"
          SSH="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/release_key"
          TARGET="$RELEASE_USER@$RELEASE_HOST"
          SRC="dist/release/$VERSION"

          $SSH "$TARGET" "mkdir -p '$RELEASE_PATH/v$VERSION'"
          # Exclude latest.json from the bulk copy; it is promoted separately.
          rsync -e "$SSH" -avz --exclude latest.json "$SRC/" "$TARGET:$RELEASE_PATH/v$VERSION/"
          # Version-local copy of the feed, then the root feed that clients poll.
          rsync -e "$SSH" -avz "$SRC/latest.json" "$TARGET:$RELEASE_PATH/v$VERSION/latest.json"
          rsync -e "$SSH" -avz "$SRC/latest.json" "$TARGET:$RELEASE_PATH/latest.json"
          echo "Published v$VERSION to $TARGET:$RELEASE_PATH"

      - name: Summary
        run: |
          echo "Version: $VERSION"
          echo "Artifacts: dist/release/$VERSION"
          cat "dist/release/$VERSION/SHA256SUMS"
