name: Release (verify only)

# PUBLISHING IS OWNED BY GITHUB ACTIONS -- see .github/workflows/release.yml.
# That workflow creates the GitHub Release, uploads the archives as assets and
# publishes latest.json to GitHub Pages. This Gitea workflow deliberately does
# NOT publish anything: two pipelines firing on the same `v*` tag would race
# over latest.json and could advertise a version whose assets are not up yet.
#
# What is left here is verification: on a tag push, prove that the gate is green
# and that scripts/build-release.sh actually produces the full artifact set on a
# clean Linux runner. Nothing leaves the runner; there is no VPS and no rsync.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (with or without the leading v)'
        required: false
        default: ''

concurrency:
  group: release-verify-tionharness
  cancel-in-progress: false

jobs:
  # Same gate as ci.yml. A workflow cannot `needs:` a job in another workflow
  # file, so the check is repeated here rather than trusted to run elsewhere.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIONHARNESS_ENABLE_SHELL: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Placeholder for the embedded SPA
        run: mkdir -p internal/web/dist && touch internal/web/dist/index.html

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race -timeout 900s

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Tags are needed by build-release.sh (git describe) and by the version
      # resolution below, so fetch the full history rather than a shallow tip.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Tag push -> ref_name is the tag; manual run -> the dispatch input.
      - name: Resolve version
        env:
          REF_NAME: ${{ gitea.ref_name }}
          INPUT_VERSION: ${{ gitea.event.inputs.version }}
        run: |
          RAW="${INPUT_VERSION:-$REF_NAME}"
          VERSION="${RAW#v}"
          if [ -z "$VERSION" ]; then
            echo "No version: push a vX.Y.Z tag or supply the version input." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Verifying build of version $VERSION"

      # The same two bases GitHub Actions uses, so the generated latest.json here
      # is byte-comparable with the published one.
      - name: Build release artifacts
        env:
          NODE_OPTIONS: --max_old_space_size=1536
          FEED_BASE: https://tionharness.com
        run: |
          export ARTIFACT_BASE="https://github.com/bilal-arikan/tionharness/releases/download/v$VERSION"
          scripts/build-release.sh "$VERSION"
          ls -la "dist/release/$VERSION"

      - name: Summary
        run: |
          echo "Version: $VERSION -- build verified, nothing published."
          echo "Publishing happens in .github/workflows/release.yml."
          cat "dist/release/$VERSION/SHA256SUMS"
          cat "dist/release/$VERSION/latest.json"
