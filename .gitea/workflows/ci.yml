name: CI

# Test gate for every push/PR to main. Release workflows use the same scripts/ci.sh gates.
#
# Native toolchains, no container-in-container indirection: the runner is
# already an isolated Linux box.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Without this the shell-tool tests skip instead of running.
      TIONHARNESS_ENABLE_SHELL: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Full race tests stay on Linux, where the runner supplies the CGO toolchain.
      - name: Backend gate
        run: bash scripts/ci.sh backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Includes install, tests, TypeScript checking and the production bundle.
      - name: Frontend gate
        env:
          NODE_OPTIONS: --max_old_space_size=1536
        run: bash scripts/ci.sh frontend
