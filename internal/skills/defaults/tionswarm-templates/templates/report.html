<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{.title}}</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1f2933;
        background: #f5f7fa;
        line-height: 1.55;
      }
      .sheet { max-width: 760px; margin: 24px auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); }
      header { padding: 28px 32px; background: linear-gradient(135deg, #0ea5e9, #6366f1); color: #fff; }
      header h1 { margin: 0 0 4px; font-size: 22px; }
      header .meta { font-size: 13px; opacity: 0.9; }
      .summary { padding: 20px 32px; font-size: 15px; color: #334155; border-bottom: 1px solid #e2e8f0; }
      section.item { padding: 18px 32px; border-bottom: 1px solid #eef2f7; }
      section.item h2 { margin: 0 0 6px; font-size: 16px; color: #0f172a; }
      section.item p { margin: 0; font-size: 14px; color: #475569; }
      footer { padding: 18px 32px; font-size: 12px; color: #94a3b8; }
      .empty { padding: 18px 32px; font-size: 14px; color: #94a3b8; font-style: italic; }
    </style>
  </head>
  <body>
    <div class="sheet">
      <header>
        <h1>{{.title}}</h1>
        <div class="meta">{{.subtitle}}{{if .date}} · {{.date}}{{end}}</div>
      </header>
      {{if .summary}}<div class="summary">{{.summary}}</div>{{end}}
      {{if .items}}
        {{range .items}}
          <section class="item">
            <h2>{{.heading}}</h2>
            <p>{{.body}}</p>
          </section>
        {{end}}
      {{else}}
        <div class="empty">No items provided.</div>
      {{end}}
      <footer>{{if .footer}}{{.footer}}{{else}}Generated by TionSwarm{{end}}</footer>
    </div>
  </body>
</html>
