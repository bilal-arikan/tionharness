<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{.subject}}</title>
    <style>
      body { margin: 0; background: #eef2f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1f2933; }
      .wrap { max-width: 600px; margin: 24px auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); }
      .bar { height: 6px; background: linear-gradient(90deg, #0ea5e9, #6366f1); }
      .body { padding: 32px; }
      .body h1 { margin: 0 0 16px; font-size: 20px; color: #0f172a; }
      .body p { margin: 0 0 14px; font-size: 15px; line-height: 1.6; color: #334155; }
      .cta { display: inline-block; margin-top: 8px; padding: 11px 20px; background: #0ea5e9; color: #fff; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 600; }
      .foot { padding: 18px 32px; font-size: 12px; color: #94a3b8; border-top: 1px solid #eef2f7; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="bar"></div>
      <div class="body">
        <h1>{{if .heading}}{{.heading}}{{else}}{{.subject}}{{end}}</h1>
        <p>Hi{{if .recipient}} {{.recipient}}{{end}},</p>
        {{range .paragraphs}}<p>{{.}}</p>{{end}}
        {{if .ctaUrl}}<a class="cta" href="{{.ctaUrl}}">{{if .ctaLabel}}{{.ctaLabel}}{{else}}Learn more{{end}}</a>{{end}}
      </div>
      <div class="foot">{{if .footer}}{{.footer}}{{else}}Sent via TionSwarm{{end}}</div>
    </div>
  </body>
</html>
