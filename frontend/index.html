<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <style>
      /* Boot splash: inlined so it paints during initial HTML parsing, before
         the app bundle or any external stylesheet has loaded. This is what
         covers the native desktop window's blank-white gap between
         WebView2 navigation and the first React paint. Colors are hardcoded
         (dark theme default) since the app's CSS custom properties are not
         defined yet at this point. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e0e10;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #0e0e10;
        color: #e7e7ea;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #boot-splash svg {
        width: 44px;
        height: 42px;
      }
      #boot-splash-text {
        font-size: 0.9rem;
        letter-spacing: 0.02em;
        color: #9a9aa6;
      }
      #boot-splash-error {
        display: none;
        max-width: 26rem;
        padding: 0 1.5rem;
        text-align: center;
        font-size: 0.85rem;
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <!-- Static (no-JS-required) splash. Removed by shared/lib/bootSplash.ts
         once React has committed its first paint into #root. -->
    <div id="boot-splash">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 46" fill="none">
        <path
          fill="#8b5cf6"
          d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"
        />
      </svg>
      <span id="boot-splash-text">TionSwarm yükleniyor…</span>
      <span id="boot-splash-error"
        >Uygulama yüklenemedi. Pencereyi kapatıp yeniden açmayı deneyin.</span
      >
    </div>
    <div id="root"></div>
    <script>
      // Fail-safe: if the app bundle never mounts (load failure, crash before
      // first paint), surface a visible error instead of leaving the splash
      // spinning forever with no indication anything went wrong.
      window.__bootSplashTimeout = window.setTimeout(function () {
        var err = document.getElementById('boot-splash-error')
        if (err) err.style.display = 'block'
      }, 12000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
