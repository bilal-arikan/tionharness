<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TionHarness</title>
    <style>
      /* Boot splash: inlined so it paints during initial HTML parsing, before
         the app bundle or any external stylesheet has loaded. This is what
         covers the native desktop window's blank-white gap between
         WebView2 navigation and the first React paint. Colors are hardcoded
         (dark theme default) since the app's CSS custom properties are not
         defined yet at this point. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e0e10;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #0e0e10;
        color: #e7e7ea;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #boot-splash svg {
        width: 44px;
        height: 44px;
      }
      #boot-splash-text {
        font-size: 0.9rem;
        letter-spacing: 0.02em;
        color: #9a9aa6;
      }
      #boot-splash-error {
        display: none;
        max-width: 26rem;
        padding: 0 1.5rem;
        text-align: center;
        font-size: 0.85rem;
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <!-- Static (no-JS-required) splash. Removed by shared/lib/bootSplash.ts
         once React has committed its first paint into #root. -->
    <div id="boot-splash">
      <!-- Same "TH" monogram as /favicon.svg, inlined so it paints without a
           network round-trip. Keep the two in sync when the brand mark changes. -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
        <rect width="48" height="48" fill="#863bff" rx="11" />
        <g fill="#fff">
          <rect width="15" height="4.4" x="7" y="14" rx="1" />
          <rect width="4.4" height="20" x="12.3" y="14" rx="1" />
          <rect width="4.4" height="20" x="26" y="14" rx="1" />
          <rect width="4.4" height="20" x="36.6" y="14" rx="1" />
          <rect width="15" height="4.4" x="26" y="21.8" rx="1" />
        </g>
      </svg>
      <span id="boot-splash-text">TionHarness yükleniyor…</span>
      <span id="boot-splash-error"
        >Uygulama yüklenemedi. Pencereyi kapatıp yeniden açmayı deneyin.</span
      >
    </div>
    <div id="root"></div>
    <script>
      // Fail-safe: if the app bundle never mounts (load failure, crash before
      // first paint), surface a visible error instead of leaving the splash
      // spinning forever with no indication anything went wrong.
      window.__bootSplashTimeout = window.setTimeout(function () {
        var err = document.getElementById('boot-splash-error')
        if (err) err.style.display = 'block'
      }, 12000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
