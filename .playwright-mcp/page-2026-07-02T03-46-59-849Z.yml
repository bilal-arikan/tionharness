                - /url: "#cite_note-memmodel-112"
            - text: "While the communicating-processes model is favored in Go, it is not the only one: all goroutines in a program share a single address space. This means that mutable objects and pointers can be shared between goroutines; see"
            - link "§ Lack of data race safety" [ref=e987] [cursor=pointer]:
