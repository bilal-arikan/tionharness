            - superscript [ref=e347]:
              - link "[27]" [ref=e348] [cursor=pointer]:
                - /url: "#cite_note-27"
            - superscript [ref=e349]:
              - link "[28]" [ref=e350] [cursor=pointer]:
                - /url: "#cite_note-28"
          - paragraph [ref=e351]:
            - text: Go was publicly announced in November 2009,
            - superscript [ref=e352]:
              - link "[29]" [ref=e353] [cursor=pointer]:
                - /url: "#cite_note-29"
            - text: and version 1.0 was released in March 2012.
            - superscript [ref=e354]:
              - link "[30]" [ref=e355] [cursor=pointer]:
                - /url: "#cite_note-30"
            - superscript [ref=e356]:
              - link "[31]" [ref=e357] [cursor=pointer]:
                - /url: "#cite_note-31"
            - text: Go is widely used in production at Google
            - superscript [ref=e358]:
              - link "[32]" [ref=e359] [cursor=pointer]:
                - /url: "#cite_note-faq-32"
            - text: and in many other organizations and open-source projects.
          - paragraph [ref=e360]:
            - text: In retrospect the Go authors judged Go to be successful due to the overall engineering work around
            - superscript [ref=e361]:
              - text: "["
              - link "clarification needed" [ref=e363] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Please_clarify
              - text: "]"
            - text: the language, including the runtime support for the language's concurrency feature.
          - blockquote [ref=e364]:
            - paragraph [ref=e365]:
              - text: Although the design of most languages concentrates on innovations in syntax, semantics, or typing, Go is focused on the software development process itself. ... The principal unusual property of the language itself—concurrency—addressed problems that arose with the proliferation of multicore CPUs in the 2010s. But more significant was the early work that established fundamentals for packaging, dependencies, build, test, deployment, and other workaday tasks of the software development world, aspects that are not usually foremost in language design.
              - superscript [ref=e366]:
                - link "[33]" [ref=e367] [cursor=pointer]:
                  - /url: "#cite_note-33"
          - generic [ref=e368]:
            - heading "Branding and styling" [level=3] [ref=e369]
            - generic [ref=e370]:
              - link "edit":
                - /url: /w/index.php?title=Go_(programming_language)&action=edit&section=2
          - figure "A drawing of Go's mascot, a cartoon gopher." [ref=e371]:
            - link [ref=e372] [cursor=pointer]:
              - /url: /wiki/File:Golang.png
              - img [ref=e373]
            - generic [ref=e374]:
              - text: A drawing of Go's mascot, a cartoon
              - link "gopher" [ref=e375] [cursor=pointer]:
                - /url: /wiki/Gopher
              - text: .
          - paragraph [ref=e376]:
            - text: The
            - link "gopher" [ref=e377] [cursor=pointer]:
              - /url: /wiki/Gopher
            - link "mascot" [ref=e378] [cursor=pointer]:
              - /url: /wiki/Mascot
            - text: was introduced in 2009 for the
            - link "open source" [ref=e379] [cursor=pointer]:
              - /url: /wiki/Open_source
            - text: launch of the language.
            - link "Renée French" [ref=e380] [cursor=pointer]:
              - /url: /wiki/Ren%C3%A9e_French
            - text: ", who had designed the rabbit mascot for"
            - link "Plan 9" [ref=e381] [cursor=pointer]:
              - /url: /wiki/Plan_9_from_Bell_Labs
            - text: ", adapted the gopher from an earlier"
            - link "WFMU" [ref=e382] [cursor=pointer]:
              - /url: /wiki/WFMU
            - text: T-shirt design.
            - superscript [ref=e383]:
              - link "[34]" [ref=e384] [cursor=pointer]:
                - /url: "#cite_note-34"
          - paragraph [ref=e385]:
            - text: In November 2016, the Go and Go Mono fonts were released by type designers
            - link "Charles Bigelow" [ref=e386] [cursor=pointer]:
              - /url: /wiki/Charles_Bigelow_(type_designer)
            - text: and
            - link "Kris Holmes" [ref=e387] [cursor=pointer]:
              - /url: /wiki/Kris_Holmes
            - text: specifically for use by the Go project. Go is a
            - link "humanist sans-serif" [ref=e388] [cursor=pointer]:
              - /url: /wiki/Humanist_sans-serif
            - text: resembling
            - link "Lucida Grande" [ref=e389] [cursor=pointer]:
              - /url: /wiki/Lucida_Grande
            - text: ", and Go Mono is"
            - link "monospaced" [ref=e390] [cursor=pointer]:
              - /url: /wiki/Monospaced
            - text: . Both fonts adhere to the
            - link "WGL4" [ref=e391] [cursor=pointer]:
              - /url: /wiki/WGL4
            - text: character set and were designed to be legible with a large
            - link "x-height" [ref=e392] [cursor=pointer]:
              - /url: /wiki/X-height
            - text: and distinct
            - link "letterforms" [ref=e393] [cursor=pointer]:
              - /url: /wiki/Letterform
            - text: . Both Go and Go Mono adhere to the
            - link "DIN" [ref=e394] [cursor=pointer]:
              - /url: /wiki/DIN
            - text: 1450 standard by having a slashed zero, lowercase
            - code [ref=e395]: i
            - text: with a tail, and an uppercase
            - code [ref=e396]: I
            - text: with serifs.
            - superscript [ref=e397]:
              - link "[35]" [ref=e398] [cursor=pointer]:
                - /url: "#cite_note-35"
            - superscript [ref=e399]:
              - link "[36]" [ref=e400] [cursor=pointer]:
                - /url: "#cite_note-36"
          - paragraph [ref=e401]:
            - text: In April 2018, the original logo was redesigned by brand designer Adam Smith. The new logo is a modern, stylized GO slanting right with trailing streamlines. The gopher mascot remained the same.
            - superscript [ref=e402]:
              - link "[37]" [ref=e403] [cursor=pointer]:
