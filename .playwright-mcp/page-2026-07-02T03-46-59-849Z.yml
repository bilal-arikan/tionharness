                  - text: ", and the"
                  - code [ref=e494]: select
                  - text: statement
                - listitem [ref=e495]:
                  - text: An
                  - link "interface" [ref=e496] [cursor=pointer]:
                    - /url: /wiki/Protocol_(object-oriented_programming)
                  - text: system in place of
                  - link "virtual inheritance" [ref=e497] [cursor=pointer]:
