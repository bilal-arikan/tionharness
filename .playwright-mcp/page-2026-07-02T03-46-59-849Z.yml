          - paragraph [ref=e343]:
            - text: Its designers were primarily motivated by their shared dislike of
            - link "C++" [ref=e344] [cursor=pointer]:
              - /url: /wiki/C%2B%2B
            - text: .
            - superscript [ref=e345]:
