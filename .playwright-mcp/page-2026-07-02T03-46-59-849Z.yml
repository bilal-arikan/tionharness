                - /url: "#cite_note-phrasebook-103"
            - superscript [ref=e1023]: ": 155"
            - text: The gc toolchain has an optional data race detector that can check for unsynchronized access to shared memory during runtime since version 1.1,
            - superscript [ref=e1024]:
