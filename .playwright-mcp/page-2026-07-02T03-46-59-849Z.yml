          - paragraph [ref=e1309]:
            - text: On November 10, 2009, the day of the general release of the language, Francis McCabe, developer of the
            - link "Go! programming language" [ref=e1310] [cursor=pointer]:
              - /url: /wiki/Go!_(programming_language)
            - text: (note the exclamation point), requested a name change of Google's language to prevent confusion with his language, which he had spent 10 years developing.
            - superscript [ref=e1311]:
              - link "[157]" [ref=e1312] [cursor=pointer]:
                - /url: "#cite_note-165"
            - text: McCabe raised concerns that "the 'big guy' will end up steam-rollering over" him, and this concern resonated with the more than 120 developers who commented on Google's official issues thread saying they should change the name, with some
            - superscript [ref=e1313]:
              - link "[158]" [ref=e1314] [cursor=pointer]:
                - /url: "#cite_note-infoweek-166"
            - text: "even saying the issue contradicts Google's motto of:"
