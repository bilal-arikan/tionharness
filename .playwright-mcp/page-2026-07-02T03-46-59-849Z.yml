          - paragraph [ref=e508]:
            - text: Go's syntax includes changes from
            - link "C" [ref=e509] [cursor=pointer]:
              - /url: /wiki/C_(programming_language)
            - text: aimed at keeping code concise and readable. A combined declaration/initialization operator was introduced that allows the programmer to write
            - code [ref=e510]: i := 3
            - text: or
            - code [ref=e511]: s := "Hello, world!"
            - text: ","
            - link "without specifying the types" [ref=e512] [cursor=pointer]:
              - /url: /wiki/Type_inference
            - text: of variables used. This contrasts with C's
            - code [ref=e513]: int i = 3;
            - text: and
            - code [ref=e514]: char *s = "Hello, world!";
            - text: (though since
            - link "C23" [ref=e515] [cursor=pointer]:
