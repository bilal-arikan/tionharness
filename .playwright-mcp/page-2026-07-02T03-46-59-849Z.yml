            - text: type inference has been supported using
            - code [ref=e516]: auto
            - text: ", like"
            - link "C++" [ref=e517] [cursor=pointer]:
              - /url: /wiki/C%2B%2B
            - text: ). Go also removes the requirement to use parentheses in
            - code [ref=e518]: if
            - text: statement conditions.
