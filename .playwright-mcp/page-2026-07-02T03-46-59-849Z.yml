          - paragraph [ref=e1185]:
            - text: The following simple program demonstrates Go's
            - link "concurrency features" [ref=e1186] [cursor=pointer]:
              - /url: "#Concurrency"
            - text: "to implement an asynchronous program. It launches two lightweight threads (\"goroutines\"): one waits for the user to type some text, while the other implements a timeout. The select statement waits for either of these goroutines to send a message to the main routine, and acts on the first message to arrive (example adapted from David Chisnall's book)."
            - superscript [ref=e1187]:
              - link "[99]" [ref=e1188] [cursor=pointer]:
                - /url: "#cite_note-phrasebook-103"
            - superscript [ref=e1189]: ": 152"
          - generic [ref=e1191]: "package main import ( \"fmt\" \"time\" ) func readword(ch chan string) { fmt.Println(\"Type a word, then hit Enter.\") var word string fmt.Scanf(\"%s\", &word) ch <- word } func timeout(t chan bool) { time.Sleep(5 * time.Second) t <- false } func main() { t := make(chan bool) go timeout(t) ch := make(chan string) go readword(ch) select { case word := <-ch: fmt.Println(\"Received\", word) case <-t: fmt.Println(\"Timeout.\") } }"
