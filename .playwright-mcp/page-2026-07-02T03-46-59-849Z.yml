          - paragraph [ref=e1087]: "The Go authors put substantial effort into influencing the style of Go programs:"
          - list [ref=e1088]:
            - listitem [ref=e1089]:
              - text: Indentation, spacing, and other surface-level details of code are automatically standardized by the
