          - paragraph [ref=e1245]:
            - text: The interface system, and the deliberate omission of inheritance, were praised by Michele Simionato, who likened these characteristics to those of
            - link "Standard ML" [ref=e1246] [cursor=pointer]:
              - /url: /wiki/Standard_ML
            - text: ", calling it \"a shame that no popular language has followed [this] particular route\"."
            - superscript [ref=e1247]:
              - link "[144]" [ref=e1248] [cursor=pointer]:
                - /url: "#cite_note-152"
          - paragraph [ref=e1249]:
            - text: Dave Astels at
            - link "Engine Yard" [ref=e1250] [cursor=pointer]:
              - /url: /wiki/Engine_Yard
            - text: "wrote in 2009:"
            - superscript [ref=e1251]:
              - link "[145]" [ref=e1252] [cursor=pointer]:
                - /url: "#cite_note-153"
          - blockquote [ref=e1253]:
            - paragraph [ref=e1254]:
              - text: Go is extremely easy to dive into. There are a minimal number of fundamental language concepts and the
              - link "syntax" [ref=e1255] [cursor=pointer]:
                - /url: /wiki/Syntax_(programming_languages)
              - text: is clean and designed to be clear and unambiguous. Go is still experimental and still a little rough around the edges.
          - paragraph [ref=e1256]:
            - text: Go was named Programming Language of the Year by the
            - link "TIOBE Programming Community Index" [ref=e1257] [cursor=pointer]:
              - /url: /wiki/TIOBE_Programming_Community_Index
            - text: in its first year, 2009, for having a larger 12-month increase in popularity (in only 2 months, after its introduction in November) than any other language that year, and reached 13th place by January 2010,
            - superscript [ref=e1258]:
              - link "[146]" [ref=e1259] [cursor=pointer]:
                - /url: "#cite_note-154"
            - text: surpassing established languages like
            - link "Pascal" [ref=e1260] [cursor=pointer]:
              - /url: /wiki/Pascal_(programming_language)
            - text: . By June 2015, its ranking had dropped to below 50th in the index, placing it lower than
            - link "COBOL" [ref=e1261] [cursor=pointer]:
              - /url: /wiki/COBOL
            - text: and
            - link "Fortran" [ref=e1262] [cursor=pointer]:
              - /url: /wiki/Fortran
            - text: .
            - superscript [ref=e1263]:
              - link "[147]" [ref=e1264] [cursor=pointer]:
                - /url: "#cite_note-155"
            - text: But as of January 2017, its ranking had surged to 13th, indicating significant growth in popularity and adoption. Go was again awarded TIOBE Programming Language of the Year in 2016.
            - superscript [ref=e1265]:
              - link "[148]" [ref=e1266] [cursor=pointer]:
                - /url: "#cite_note-156"
          - paragraph [ref=e1267]:
            - link "Bruce Eckel" [ref=e1268] [cursor=pointer]:
              - /url: /wiki/Bruce_Eckel
            - text: "has stated:"
            - superscript [ref=e1269]:
              - link "[149]" [ref=e1270] [cursor=pointer]:
                - /url: "#cite_note-157"
          - blockquote [ref=e1271]:
            - paragraph [ref=e1272]:
              - text: The complexity of
              - link "C++" [ref=e1273] [cursor=pointer]:
                - /url: /wiki/C%2B%2B
              - text: (even more complexity has been added in the new C++), and the resulting impact on productivity, is no longer justified. All the hoops that the C++ programmer had to jump through in order to use a C-compatible language make no sense anymore -- they're just a waste of time and effort. Go makes much more sense for the class of problems that C++ was originally intended to solve.
          - paragraph [ref=e1274]:
            - text: A 2011 evaluation of the language and its gc implementation in comparison to C++ (
            - link "GCC" [ref=e1275] [cursor=pointer]:
              - /url: /wiki/GNU_Compiler_Collection
            - text: ), Java and
            - link "Scala" [ref=e1276] [cursor=pointer]:
              - /url: /wiki/Scala_(programming_language)
            - text: "by a Google engineer found:"
          - blockquote [ref=e1277]:
            - paragraph [ref=e1278]: Go offers interesting language features, which also allow for a concise and standardized notation. The compilers for this language are still immature, which reflects in both performance and binary sizes.
          - paragraph [ref=e1280]:
            - text: — R. Hundt
            - superscript [ref=e1281]:
              - link "[150]" [ref=e1282] [cursor=pointer]:
                - /url: "#cite_note-158"
          - paragraph [ref=e1283]:
            - text: The evaluation got a rebuttal from the Go development team. Ian Lance Taylor, who had improved the Go code for Hundt's paper, had not been aware of the intention to publish his code, and says that his version was "never intended to be an example of idiomatic or efficient Go"; Russ Cox then optimized the Go code, as well as the C++ code, and got the Go code to run almost as fast as the C++ version and more than an order of magnitude faster than the code in the paper.
            - superscript [ref=e1284]:
              - link "[151]" [ref=e1285] [cursor=pointer]:
                - /url: "#cite_note-159"
          - list [ref=e1286]:
            - listitem [ref=e1287]:
              - text: Go's
              - link "nil" [ref=e1289] [cursor=pointer]:
                - /url: /wiki/Null_pointer
              - text: combined with the lack of
              - link "algebraic types" [ref=e1290] [cursor=pointer]:
                - /url: /wiki/Algebraic_types
              - text: leads to difficulty handling failures and
              - link "base cases" [ref=e1291] [cursor=pointer]:
                - /url: /wiki/Base_case_(recursion)
              - text: .
              - superscript [ref=e1292]:
                - link "[152]" [ref=e1293] [cursor=pointer]:
                  - /url: "#cite_note-yager-160"
              - superscript [ref=e1294]:
                - link "[153]" [ref=e1295] [cursor=pointer]:
                  - /url: "#cite_note-dobronszki-161"
            - listitem [ref=e1296]:
              - text: Go has been criticized for focusing on simplicity of implementation rather than correctness and flexibility; as an example, the language uses
              - link "POSIX" [ref=e1297] [cursor=pointer]:
                - /url: /wiki/POSIX
              - text: file semantics on all platforms, and therefore provides incorrect information on platforms such as
              - link "Windows" [ref=e1298] [cursor=pointer]:
                - /url: /wiki/Microsoft_Windows
              - text: (which do not follow the aforementioned standard).
              - superscript [ref=e1299]:
                - link "[154]" [ref=e1300] [cursor=pointer]:
                  - /url: "#cite_note-162"
              - superscript [ref=e1301]:
                - link "[155]" [ref=e1302] [cursor=pointer]:
                  - /url: "#cite_note-163"
            - listitem [ref=e1303]:
              - text: A study showed that it is as easy to make concurrency bugs with message passing as with shared memory, sometimes even more.
              - superscript [ref=e1304]:
                - link "[156]" [ref=e1305] [cursor=pointer]:
                  - /url: "#cite_note-164"
          - generic [ref=e1306]:
