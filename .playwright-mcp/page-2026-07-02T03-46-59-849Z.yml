                  - text: and online package documentation
                  - superscript [ref=e487]:
                    - link "[55]" [ref=e488] [cursor=pointer]:
                      - /url: "#cite_note-55"
            - listitem [ref=e489]:
              - text: "Distinctive approaches to particular problems:"
              - list [ref=e490]:
                - listitem [ref=e491]:
                  - text: "Built-in concurrency primitives:"
                  - link "light-weight processes" [ref=e492] [cursor=pointer]:
