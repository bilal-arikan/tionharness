          - paragraph [ref=e1010]:
            - text: Go's approach to concurrency can be summarized as "don't communicate by sharing memory; share memory by communicating".
            - superscript [ref=e1011]:
              - link "[111]" [ref=e1012] [cursor=pointer]:
                - /url: "#cite_note-115"
            - text: There are no restrictions on how goroutines access shared data, making
            - link "data races" [ref=e1013] [cursor=pointer]:
              - /url: /wiki/Data_race
            - text: possible. Specifically, unless a program explicitly synchronizes via channels or other means, writes from one goroutine might be partly, entirely, or not at all visible to another, often with no guarantees about ordering of writes.
            - superscript [ref=e1014]:
              - link "[108]" [ref=e1015] [cursor=pointer]:
                - /url: "#cite_note-memmodel-112"
            - text: Furthermore, Go's internal data structures like interface values, slice headers, hash tables, and string headers are not immune to data races, so type and memory safety can be violated in multithreaded programs that modify shared instances of those types without synchronization.
            - superscript [ref=e1016]:
              - link "[112]" [ref=e1017] [cursor=pointer]:
                - /url: "#cite_note-116"
            - superscript [ref=e1018]:
              - link "[113]" [ref=e1019] [cursor=pointer]:
                - /url: "#cite_note-SPLASH2012-117"
            - text: Instead of language support, safe concurrent programming thus relies on conventions; for example, Chisnall recommends an idiom called "aliases
            - link "xor" [ref=e1020] [cursor=pointer]:
