              - /url: /wiki/Don%27t_be_evil
            - text: .
            - superscript [ref=e1316]:
              - link "[159]" [ref=e1317] [cursor=pointer]:
                - /url: "#cite_note-issue9-167"
          - paragraph [ref=e1318]: "On October 12, 2010, the filed public issue ticket was closed by Google developer Russ Cox (@rsc) with the custom label \"Unfortunate\" accompanied by the following comment:"
          - blockquote [ref=e1319]:
