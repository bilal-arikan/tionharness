          - generic [ref=e404]:
            - heading "Generics" [level=3] [ref=e405]
            - generic [ref=e406]:
              - link "edit":
                - /url: /w/index.php?title=Go_(programming_language)&action=edit&section=3
          - paragraph [ref=e407]:
            - text: The lack of support for
            - link "generic programming" [ref=e408] [cursor=pointer]:
              - /url: /wiki/Generic_programming
            - text: in initial versions of Go drew considerable criticism.
            - superscript [ref=e409]:
              - link "[38]" [ref=e410] [cursor=pointer]:
                - /url: "#cite_note-38"
            - text: The designers expressed an openness to generic programming and noted that built-in functions were in fact type-generic, but are treated as special cases; Pike called this a weakness that might be changed at some point.
            - superscript [ref=e411]:
              - link "[39]" [ref=e412] [cursor=pointer]:
                - /url: "#cite_note-append-39"
            - text: The Google team built at least one compiler for an experimental Go dialect with generics, but did not release it.
            - superscript [ref=e413]:
              - link "[40]" [ref=e414] [cursor=pointer]:
                - /url: "#cite_note-40"
          - paragraph [ref=e415]:
            - text: In August 2018, the Go principal contributors published draft designs for generic programming and
            - link "error handling" [ref=e416] [cursor=pointer]:
              - /url: /wiki/Exception_handling
            - text: and asked users to submit feedback.
            - superscript [ref=e417]:
              - link "[41]" [ref=e418] [cursor=pointer]:
                - /url: "#cite_note-41"
            - superscript [ref=e419]:
              - link "[42]" [ref=e420] [cursor=pointer]:
                - /url: "#cite_note-42"
            - text: However, the error handling proposal was eventually abandoned.
            - superscript [ref=e421]:
              - link "[43]" [ref=e422] [cursor=pointer]:
                - /url: "#cite_note-43"
          - paragraph [ref=e423]:
            - text: In June 2020, a new draft design document
            - superscript [ref=e424]:
              - link "[44]" [ref=e425] [cursor=pointer]:
                - /url: "#cite_note-44"
            - text: was published that would add the necessary syntax to Go for declaring generic functions and types. A code translation tool,
            - generic [ref=e426]: go2go
            - text: ", was provided to allow users to try the new syntax, along with a generics-enabled version of the online Go Playground."
            - superscript [ref=e427]:
              - link "[45]" [ref=e428] [cursor=pointer]:
                - /url: "#cite_note-45"
          - paragraph [ref=e429]:
            - text: Generics were finally added to Go in version 1.18 on March 15, 2022.
            - superscript [ref=e430]:
              - link "[46]" [ref=e431] [cursor=pointer]:
                - /url: "#cite_note-46"
          - generic [ref=e432]:
            - heading "Versioning" [level=3] [ref=e433]
            - generic [ref=e434]:
              - link "edit":
                - /url: /w/index.php?title=Go_(programming_language)&action=edit&section=4
          - paragraph [ref=e435]:
            - text: Go 1 guarantees compatibility
            - superscript [ref=e436]:
              - link "[47]" [ref=e437] [cursor=pointer]:
                - /url: "#cite_note-47"
            - text: for the language specification and major parts of the standard library. All versions up through the current Go 1.26 release
            - superscript [ref=e438]:
              - link "[48]" [ref=e439] [cursor=pointer]:
                - /url: "#cite_note-48"
            - text: have maintained this promise.
          - paragraph [ref=e440]:
            - text: Go uses a
            - code [ref=e441]: go1.[major].[patch]
            - text: versioning format, such as
            - code [ref=e442]: go1.26.0
            - text: and each major Go release is supported until there are two newer major releases. Unlike most software, Go calls the second number in a version the major, i.e., in
            - code [ref=e443]: go1.26.0
            - text: the
            - code [ref=e444]: "26"
            - text: is the major version.
            - superscript [ref=e445]:
              - link "[49]" [ref=e446] [cursor=pointer]:
                - /url: "#cite_note-49"
            - text: This is because Go plans to never reach 2.0, prioritizing backwards compatibility over potential breaking changes.
            - superscript [ref=e447]:
              - link "[50]" [ref=e448] [cursor=pointer]:
                - /url: "#cite_note-50"
          - generic [ref=e449]:
            - heading "Design" [level=2] [ref=e450]
            - generic [ref=e451]:
              - link "edit":
